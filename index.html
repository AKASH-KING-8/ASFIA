<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Asfia ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .rain-text {
            position: absolute;
            color: #ff2e63;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            letter-spacing: 1px;
            z-index: 100;
            opacity: 0.7;
        }
        @keyframes fall {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <div class="footer">Developed by Akash King</div>

    <script>
        function createRain() {
            const textElement = document.createElement('div');
            textElement.classList.add('rain-text');
            textElement.innerText = "I Love You Asfia ❤️";
            
            const fontSize = Math.random() * (22 - 14) + 14; 
            const leftPos = Math.random() * 100;
            const duration = Math.random() * (4 - 2) + 2; 
            const opacity = Math.random() * (0.9 - 0.4) + 0.4;

            textElement.style.fontSize = fontSize + 'px';
            textElement.style.left = leftPos + 'vw';
            textElement.style.animationDuration = duration + 's';
            textElement.style.opacity = opacity;

            document.body.appendChild(textElement);

            setTimeout(() => {
                textElement.remove();
            }, duration * 1000);
        }

        setInterval(createRain, 150);
    </script>
</body>
</html>
